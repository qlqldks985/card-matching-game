name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # 테스트는 H2(MySQL 호환 모드)로 돌기 때문에 MySQL 서버가 필요 없다
      - run: ./mvnw -B test
