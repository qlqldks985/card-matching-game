# docker compose up --build  →  http://localhost:8080
# 비밀번호나 포트를 바꾸려면 .env.example 을 .env 로 복사해서 고친다.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cardgame
      MYSQL_USER: cardgame
      MYSQL_PASSWORD: ${DB_PASSWORD:-cardgame}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"   # 앱은 root 를 쓰지 않는다
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucardgame -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 호스트에 3306 을 열지 않는다 (PC 에 설치된 MySQL 과 충돌 방지, 앱만 접근)

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy   # MySQL 이 준비된 뒤에 앱을 띄운다
    environment:
      DB_HOST: db
      DB_USERNAME: cardgame
      DB_PASSWORD: ${DB_PASSWORD:-cardgame}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
