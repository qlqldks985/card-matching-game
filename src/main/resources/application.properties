spring.application.name=cardgame

# 배포 플랫폼(Railway 등)이 PORT 를 정해 주면 그 포트로, 아니면 8080
server.port=${PORT:8080}

# MySQL 접속 정보 (환경 변수로 바꿀 수 있음). 데이터베이스가 없으면 자동으로 만든다.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cardgame}?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 스키마는 Flyway 가 db/migration 의 SQL 로만 바꾸고, Hibernate 는 엔티티와 맞는지 검사만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway 도입 전에 Hibernate 가 이미 테이블을 만든 DB 는 V1 을 건너뛰고 기준점으로 삼는다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
